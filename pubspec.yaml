name: task_management_system
description: Enterprise task management system with Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^12.0.0
  
  # Network
  dio: ^5.3.3
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1
  
  # Data Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Local Storage
  drift: ^2.13.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.2.2
  
  # File Handling
  file_picker: ^6.1.1
  image_picker: ^1.0.4
  camera: ^0.10.5+5
  open_filex: ^4.3.2
  flutter_pdfview: ^1.3.2
  video_player: ^2.8.1
  image: ^4.1.3
  
  # Notifications
  flutter_local_notifications: ^16.1.0
  firebase_core: ^2.21.0
  firebase_messaging: ^14.7.3
  
  # UI Components
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  intl: ^0.18.1
  timeago: ^3.6.0
  
  # Utils
  uuid: ^4.2.1
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  permission_handler: ^11.0.1
  connectivity_plus: ^5.0.1
  
  # Logging
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.4
  drift_dev: ^2.13.0
  
  # Testing
  mockito: ^5.4.3
  bloc_test: ^9.1.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/l10n/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
